name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.PIKO_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/piko.jks"
      - name: Build signed release APK
        env:
          PIKO_KEYSTORE_FILE: ${{ runner.temp }}/piko.jks
          PIKO_KEYSTORE_PASSWORD: ${{ secrets.PIKO_KEYSTORE_PASSWORD }}
          PIKO_KEY_ALIAS: ${{ secrets.PIKO_KEY_ALIAS }}
          PIKO_KEY_PASSWORD: ${{ secrets.PIKO_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Name and checksum the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Piko-${GITHUB_REF_NAME}.apk"
          sha256sum "Piko-${GITHUB_REF_NAME}.apk" > "Piko-${GITHUB_REF_NAME}.apk.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Piko-${GITHUB_REF_NAME}.apk" "Piko-${GITHUB_REF_NAME}.apk.sha256" \
            --title "Piko ${GITHUB_REF_NAME}" --generate-notes --verify-tag
