apply plugin: 'com.android.application'

android {
    namespace 'com.piko.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.piko.launcher"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
    }

    // Release signing is supplied by CI (or a local shell) via environment variables;
    // without them the release build falls back to the debug key so it still installs.
    signingConfigs {
        release {
            def ksFile = System.getenv("PIKO_KEYSTORE_FILE")
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv("PIKO_KEYSTORE_PASSWORD")
                keyAlias System.getenv("PIKO_KEY_ALIAS")
                keyPassword System.getenv("PIKO_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            signingConfig System.getenv("PIKO_KEYSTORE_FILE") ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    buildFeatures {
        buildConfig false
    }
}

// Intentionally zero dependencies: pure Android SDK only, no AndroidX/support/material.
dependencies {}
