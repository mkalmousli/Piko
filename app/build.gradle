apply plugin: 'com.android.application'

android {
    namespace 'com.piko.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.piko.launcher"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    buildFeatures {
        buildConfig false
    }
}

// Intentionally zero dependencies: pure Android SDK only, no AndroidX/support/material.
dependencies {}
